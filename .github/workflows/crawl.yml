name: Crawl news

on:
  schedule:
    # Every 3 hours, 07:00–22:00 Thailand time (UTC+7); no night runs (2026-11-16).
    # Each run keeps only the latest APIFY_FACEBOOK_RESULTS_LIMIT posts per source,
    # so posts beyond that within a gap (notably the 9-hour overnight one) are missed.
    # 4 sources x 3 posts x 6 runs = up to 72 posts/day (was 1 x 5 x 8 = 40).
    - cron: "0 0,3,6,9,12,15 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crawl-news
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # Secrets live in the `nara-keys` environment, not as repository secrets.
    environment: nara-keys
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --workspace crawler

      - run: npm run crawl:manual --workspace crawler
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Latest N posts per source; already-saved ones are skipped.
          APIFY_FACEBOOK_RESULTS_LIMIT: "3"
