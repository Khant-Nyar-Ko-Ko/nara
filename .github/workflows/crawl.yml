name: Crawl news

on:
  schedule:
    # Every 3 hours, 07:00–22:00 Thailand time (UTC+7); night runs dropped to cut
    # Apify/Groq cost (2026-11-16). The 07:00 run picks up overnight posts.
    - cron: "0 0,3,6,9,12,15 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crawl-news
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # Secrets live in the `nara-keys` environment, not as repository secrets.
    environment: nara-keys
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --workspace crawler

      - run: npm run crawl:manual --workspace crawler
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Latest N posts per source; already-saved ones are skipped.
          APIFY_FACEBOOK_RESULTS_LIMIT: "3"
