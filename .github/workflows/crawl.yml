name: Crawl news

on:
  # Started by the Supabase pg_cron job in crawler/sql/002_crawl_timer.sql
  # every 2 hours, 07:00–21:00 Thailand time (UTC+7); no night runs. GitHub's
  # own `schedule:` was removed on 2026-11-17: it skipped about 2 of every 3
  # runs and delayed the rest by up to 4 h (gaps of 4–18 h).
  # Each run keeps only the latest APIFY_FACEBOOK_RESULTS_LIMIT posts per source,
  # so posts beyond that within a gap (notably the 10-hour overnight one) are missed.
  # 5 sources x 3 posts x 8 runs = up to 120 posts/day (was 90).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crawl-news
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # Secrets live in the `nara-keys` environment, not as repository secrets.
    environment: nara-keys
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --workspace crawler

      - run: npm run crawl:manual --workspace crawler
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Latest N posts per source; already-saved ones are skipped.
          APIFY_FACEBOOK_RESULTS_LIMIT: "3"
